<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya · Kartu Info</title>
    <!-- Google Font & Font Awesome untuk ikon yang rapi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #f4f6f9;
            font-family: Inter, sans-serif;
            padding: 40px;
        }

        /* container dashboard */
        .dashboard-profile {
            max-width: 1000px;
            margin: auto;
        }

        /* main card */
        .profile-card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e9f2;
        }

        /* header */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #1f3a5f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .profile-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .role-badge {
            margin-top: 6px;
            font-size: 14px;
            background: #eef3fc;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            color: #1f3a5f;
        }

        /* grid info */
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .info-box {
            background: #fafbfd;
            border: 1px solid #e6ebf3;
            padding: 18px;
            border-radius: 12px;
        }

        .info-box label {
            font-size: 12px;
            text-transform: uppercase;
            color: #6c7e9e;
            letter-spacing: 0.5px;
        }

        .info-box .value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
        }

        .value.success {
            color: #1e7e34;
        }

        /* responsive */
        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-profile">

        <div class="profile-card">

            <!-- header -->
            <div class="profile-header">
                <div class="avatar-circle">
                    <i class="fas fa-user"></i>
                </div>

                <div>
                    <h2>Dimas Pramudya</h2>
                    <div class="role-badge">Product Designer · Senior</div>
                </div>
            </div>

            <!-- grid info -->
            <div class="profile-grid">

                <div class="info-box">
                    <label>Username</label>
                    <div class="value">@dimasprm</div>
                </div>

                <div class="info-box">
                    <label>Role</label>
                    <div class="value">Product Designer</div>
                </div>

                <div class="info-box">
                    <label>Nomor HP</label>
                    <div class="value">
                        +62 812-3456-7890
                    </div>
                </div>

                <div class="info-box">
                    <label>Status</label>
                    <div class="value success">
                        ✔ Terverifikasi
                    </div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
